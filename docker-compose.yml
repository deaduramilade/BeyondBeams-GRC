services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grc_risk_register
      POSTGRES_USER: grc_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc_app -d grc_risk_register"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
